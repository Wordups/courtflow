services:
  - type: web
    name: courtflow-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AI_PROVIDER
        value: disabled
      - key: AI_MODEL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: BOX_SCORE_PROVIDER
        value: disabled
      - key: BOX_SCORE_MODEL
        sync: false
      - key: BOX_SCORE_API_KEY
        sync: false
